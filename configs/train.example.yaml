# Training settings and defaults.
# Generated by scripts/generate_config_examples.py; do not edit manually.
# Top-level configuration for an image classification training run.

# Non-negative seed used by Python, NumPy, PyTorch, and data-loader workers. (type: Annotated[int, Ge(ge=0), Le(le=4294967295)], default: 42)
seed: 42

# Optional checkpoint from which to resume optimizer and training state. (type: Path | null, default: null)
resume_from:

# Directory receiving logs and checkpoints. (type: <class 'Path'>, default: runs/training)
output_dir: runs/training

# Loss and optimizer settings
training:

  #  (type: Annotated[float, Gt(gt=0), _PydanticGeneralMetadata(allow_inf_nan=False)], default: 0.001)
  learning_rate: 0.001

  #  (type: Annotated[float, Ge(ge=0), _PydanticGeneralMetadata(allow_inf_nan=False)], default: 0.0001)
  weight_decay: 0.0001

  #  (type: CrossEntropyConfig | BCEConfig | FocalConfig | GCEConfig, default: {'name': 'cross_entropy', 'label_smoothing': 0.0})
  loss:
    name: cross_entropy
    label_smoothing: 0.0

  #  (type: CosineScheduleConfig | null, default: null)
  scheduler:

  #  (type: ELRConfig | null, default: null)
  elr:

# Dataset and augmentation settings
dataset:

  #  (type: Literal['fake', 'imagefolder', 'manifest'], default: fake)
  kind: fake

  #  (type: Path | null, default: null)
  root:

  #  (type: Annotated[int, Ge(ge=2)], default: 2)
  num_classes: 2

  #  (type: Annotated[int, Ge(ge=16)], default: 32)
  image_size: 32

  #  (type: Annotated[int, Ge(ge=6)], default: 60)
  num_samples: 60

  #  (type: Annotated[int, Ge(ge=2)], default: 3)
  num_folds: 3

  #  (type: Annotated[int, Ge(ge=0)], default: 0)
  validation_fold: 0

  #  (type: Annotated[int, Ge(ge=0), Le(le=4294967295)], default: 42)
  split_seed: 42

  #  (type: Annotated[int, Ge(ge=1)], default: 8)
  batch_size: 8

  #  (type: Annotated[int, Ge(ge=0)], default: 0)
  num_workers: 0

  # Manifest group folds or seeded image folds; other loaders use image folds. (type: Literal['group', 'random'], default: group)
  fold_strategy: group

  # Path to a configuration file.
  augmentation:

    # Spatial changes applied independently to each training image
    spatial:

      # Probability of reflecting the horizontal image axis. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.5)
      horizontal_flip_probability: 0.5

      # Probability of reflecting the vertical image axis. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.0)
      vertical_flip_probability: 0.0

      # Probability of applying the configured affine transform. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.0)
      affine_probability: 0.0

      # Maximum absolute rotation angle. (type: Annotated[float, Ge(ge=0), Le(le=180)], default: 0.0)
      rotation_degrees: 0.0

      # Maximum horizontal and vertical translation as image-size fractions. (type: tuple[Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Ge(ge=0), Le(le=1)])], Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Ge(ge=0), Le(le=1)])]], default: [0.05, 0.05])
      max_translation:
      - 0.05
      - 0.05

      # Maximum absolute horizontal shear angle. (type: Annotated[float, Ge(ge=0), Lt(lt=90)], default: 0.0)
      shear_degrees: 0.0

    # Intensity changes for RGB inputs scaled to [0, 1]
    intensity:

      # Probability of an additive brightness shift. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.0)
      brightness_probability: 0.0

      # Probability of contrast scaling. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.0)
      contrast_probability: 0.0

      # Probability of a gamma adjustment. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.0)
      gamma_probability: 0.0

      # Probability of independent Gaussian pixel noise. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.0)
      noise_probability: 0.0

      # Maximum absolute brightness offset for inputs in [0, 1]. (type: Annotated[float, Ge(ge=0), Le(le=1)], default: 0.03)
      max_brightness_shift: 0.03

      # Lower and upper contrast factors. (type: tuple[Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])], Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])]], default: [0.9, 1.1])
      contrast_range:
      - 0.9
      - 1.1

      # Lower and upper gamma exponents. (type: tuple[Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])], Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])]], default: [0.9, 1.1])
      gamma_range:
      - 0.9
      - 1.1

      # Noise standard deviation for inputs in [0, 1]. (type: Annotated[float, Ge(ge=0)], default: 0.01)
      noise_std: 0.01

# Maximum number of complete training epochs. (type: Annotated[int, Ge(ge=1)], default: 100)
max_epochs: 100

# Number of unimproved validation epochs tolerated before stopping. (type: Annotated[int, Ge(ge=1)], default: 10)
early_stopping_patience: 10

# Lightning accelerator used for training. (type: Literal['auto', 'cpu', 'gpu', 'mps'], default: auto)
accelerator: auto

# Number of accelerator devices used by the trainer. (type: Annotated[int, Ge(ge=1)], default: 1)
devices: 1

# Numerical precision policy used by Lightning. (type: Literal['32-true', '16-mixed', 'bf16-mixed'], default: 32-true)
precision: 32-true

# ClearML project receiving the training task. (type: str | null, default: null)
clearml_project_name:

# One or more arguments specifying "class_path" and "init_args" for any subclass of VisionNetwork. (type: <class 'VisionNetwork'>, default: computer_vision.model.ResNet, known subclasses: computer_vision.model.CNN, computer_vision.model.TorchvisionClassifier, computer_vision.model.ResNet, computer_vision.model.ViT)
network:
  class_path: computer_vision.model.ResNet

  # Classify images, independent B-scans, or volumes with configured stages
  init_args:

    # Number of stored image channels, excluding coordinates. (type: int, default: 3)
    in_channels: 3

    # Convolution and optional pooling before the stages
    stem:

      # Number of stem output channels. (type: Annotated[int, Gt(gt=0)], default: 16)
      out_channels: 16

      # Odd kernel sizes in spatial tensor order. (type: tuple[Annotated[int, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])], ...], default: (3, 3))
      kernel_size:
      - 3
      - 3

      # Convolution strides in spatial tensor order. (type: tuple[Annotated[int, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])], ...], default: (1, 1))
      stride:
      - 1
      - 1

      # Optional max-pooling kernel sizes. (type: Optional[tuple[Annotated[int, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])], ...]], default: null)
      pool_size:

      # Max-pooling strides; required when pooling is enabled. (type: Optional[tuple[Annotated[int, FieldInfo(annotation=NoneType, required=True, metadata=[Gt(gt=0)])], ...]], default: null)
      pool_stride:

      # Spatial convolution output channels for a factorized stem. (type: Optional[Annotated[int | null, Gt(gt=0)]], default: null)
      intermediate_channels:

    # Residual stages in execution order. (type: tuple[ResStageConfig, ...], default: (ResStageConfig(out_channels=16, num_blocks=1, kernel_size=(3, 3), stride=(1, 1)), ResStageConfig(out_channels=32, num_blocks=1, kernel_size=(3, 3), stride=(2, 2)), ResStageConfig(out_channels=64, num_blocks=1, kernel_size=(3, 3), stride=(2, 2)), ResStageConfig(out_channels=96, num_blocks=1, kernel_size=(3, 3), stride=(2, 2)), ResStageConfig(out_channels=128, num_blocks=1, kernel_size=(3, 3), stride=(2, 2))))
    stages:
    - out_channels: 16
      num_blocks: 1
      kernel_size:
      - 3
      - 3
      stride:
      - 1
      - 1
    - out_channels: 32
      num_blocks: 1
      kernel_size:
      - 3
      - 3
      stride:
      - 2
      - 2
    - out_channels: 64
      num_blocks: 1
      kernel_size:
      - 3
      - 3
      stride:
      - 2
      - 2
    - out_channels: 96
      num_blocks: 1
      kernel_size:
      - 3
      - 3
      stride:
      - 2
      - 2
    - out_channels: 128
      num_blocks: 1
      kernel_size:
      - 3
      - 3
      stride:
      - 2
      - 2

    # Standard convolutions or separate spatial and depth convolutions. (type: Literal['standard', 'factorized'], default: standard)
    block_type: standard

    # Pretrained source and normalization. Training loads the weights;
    # direct callers must call ``load_pretrained_weights``. (type: Optional[Literal['resnet18_imagenet1k_v1', 'resnet34_imagenet1k_v1', 'r2plus1d_18_kinetics400_v1']], default: null)
    weights:

    # Process each B-scan independently with a shared 2D backbone. (type: bool, default: False)
    slice_wise: false

    # Spatial feature pooling before the classifier or slice aggregation. (type: Literal['mean', 'mean_max'], default: mean_max)
    pooling: mean_max

    # Feature pooling across B-scans, used only for slice-wise inputs. (type: Literal['mean', 'mean_max'], default: mean)
    slice_pooling: mean

    # Dropout probability before the task classifier. (type: Annotated[float, FieldInfo(annotation=NoneType, required=True, metadata=[Ge(ge=0.0), Le(le=1.0)])], default: 0.2)
    dropout: 0.2

    # Append signed tensor coordinates after augmentation. Volume and
    # slice-wise inputs include the original B-scan depth coordinate. (type: bool, default: False)
    use_coordinate_channels: false
