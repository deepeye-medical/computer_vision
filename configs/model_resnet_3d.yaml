network:
  class_path: computer_vision.model.ResNet
  init_args:
    dropout: 0.2
    use_coordinate_channels: false
    stem:
      out_channels: 16
      kernel_size: [1, 3, 3]
      stride: [1, 1, 1]
    stages:
    - out_channels: 16
      num_blocks: 1
      kernel_size: [1, 3, 3]
      stride: [1, 1, 1]
    - out_channels: 32
      num_blocks: 1
      kernel_size: [1, 3, 3]
      stride: [1, 2, 2]
    - out_channels: 64
      num_blocks: 1
      kernel_size: [3, 3, 3]
      stride: [1, 2, 2]
    - out_channels: 96
      num_blocks: 1
      kernel_size: [3, 3, 3]
      stride: [2, 2, 2]
    - out_channels: 128
      num_blocks: 1
      kernel_size: [3, 3, 3]
      stride: [2, 2, 2]
